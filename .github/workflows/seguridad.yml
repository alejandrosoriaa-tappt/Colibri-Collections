name: Seguridad

# Corre en cada push, cada PR y los lunes por la mañana.
#
# No usa `npm audit --audit-level=high` directo: xlsx tiene un fallo alto sin
# corrección publicada en npm, así que ese comando falla SIEMPRE. Un check
# permanentemente en rojo deja de leerse, y además bloquea los PRs de
# Dependabot, que son justo los que traen las correcciones.
#
# scripts/auditoria.mjs falla solo ante vulnerabilidades altas o críticas que
# no estén documentadas en .github/auditoria-excepciones.json, y las
# excepciones caducan.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'   # lunes 7am hora de México

jobs:
  auditoria:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: [backend, dashboard]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Auditar ${{ matrix.proyecto }}
        run: node scripts/auditoria.mjs ${{ matrix.proyecto }}

[build]
builder = "nixpacks"
buildCommand = "npm install && printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_API_BASE_URL=%s\n' \"$VITE_SUPABASE_URL\" \"$VITE_SUPABASE_ANON_KEY\" \"$VITE_API_BASE_URL\" > .env.production.local && npm run build"

[deploy]
startCommand = "npx serve dist --single -p $PORT"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
